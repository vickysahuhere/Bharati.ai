# One compose project == one college.
# Run: docker compose -p collegeA --env-file .env up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: camp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: camp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camp -d camp"]
      interval: 5s
      retries: 10
  api:
    build: ../backend
    env_file: .env
    volumes: [appdata:/data, ../config:/config:ro, ../frontend/dist:/frontend/dist:ro]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: ../backend
    env_file: .env
    volumes: [appdata:/data, ../config:/config:ro]
    depends_on: {db: {condition: service_healthy}}
    command: python -m worker.main
volumes:
  pgdata:
  appdata:
